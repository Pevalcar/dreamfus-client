[package]
name = "dreamfus-client"
version = "0.1.0"
description = "DreamFus Client - Dofus 3 client with JSON/CSS editable UI"
authors = ["Perroaa94"]
license = "MIT"
repository = "https://github.com/Pevalcar/dreamfus-client"
edition = "2021"
rust-version = "1.69"

[lib]
name = "dreamfus_client"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = 2